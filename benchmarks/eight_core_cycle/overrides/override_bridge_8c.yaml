# La gamba bridge del ciclo a otto core: otto worker, quindici utenti ciascuno.
#
# Le variabili le esporta il runner, non il file .env:
#   CYCLE_DIR            la directory di questo scenario, per montare la recipe
#   CYCLE_RUNTIME_DIR    la runtime del laboratorio, montata su /lab/runtime
#   GNR_ASGI_ORCH_LOG    il path del journal DENTRO il container, deciso PRIMA
#                        che il container nasca. Il path dell'host ha un altro
#                        nome, ed e' lab_lifecycle.sh a tenerli separati.
#   CYCLE_MEM_LIMIT      il limite di memoria, uguale alle due gambe
#   GNR_ASGI_WORKER_MAX_USERS  quanti utenti per worker: 15 nella prova, 2 nello
#                        smoke. E' la stessa variabile che usa la worker sensitivity.
#
# cpus e mem_limit sono ridichiarati qui, anche se l'anchor del compose porta
# altri valori: una corsa deve dire da se' con quali limiti e' stata misurata,
# senza che si debba andare a leggere un altro file.
services:
  bridge:
    cpus: 8
    mem_limit: ${CYCLE_MEM_LIMIT:-4g}
    environment:
      GNR_ASGI_POOL_RECIPE: "/lab/configs/cycle_recipe.py"
      GNR_ASGI_ORCH_LOG: ${GNR_ASGI_ORCH_LOG:?}
      # Quanti utenti per worker. Obbligatoria: un valore mancante ferma il
      # compose invece di misurare una topologia diversa da quella dichiarata.
      GNR_ASGI_WORKER_MAX_USERS: ${GNR_ASGI_WORKER_MAX_USERS:?}
      # La porta di lettura della certificazione della page-class cache. Montare
      # la console non aggiunge nulla al percorso misurato: il demux devia
      # _console sul primo segmento, prima del sito.
      GNR_ASGI_CONSOLE: ${GNR_ASGI_CONSOLE:-1}
      PYTHONPATH: "/src/genro-asgi/src:/src/genropy-asgi/src"
    volumes:
      - ${CYCLE_DIR:?}/cycle_recipe.py:/lab/configs/cycle_recipe.py:ro
      - ${CYCLE_RUNTIME_DIR:?}:/lab/runtime
